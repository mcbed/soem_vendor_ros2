# Weekly canary build.
#
# soem_vendor_ros2 fetches SOEM from GitHub at build time (ament_vendor,
# VCS_URL/VCS_VERSION in CMakeLists.txt) rather than vendoring it in-tree, so
# nothing here is pinned to a local copy of SOEM's source. This job exists to
# catch drift that the regular PR-triggered CI (ci.yml) won't see between
# PRs: the pinned upstream tag disappearing/moving, the ROS jazzy apt repo
# dropping/changing ament_cmake_vendor_package, or the .docker/Dockerfile
# image itself bit-rotting.
#
# It rebuilds the .docker/Dockerfile image and, inside it, colcon builds and
# tests soem_vendor_ros2 plus test/downstream_probe: a package that consumes
# it like a real downstream package would (find_package(soem_vendor_ros2) ->
# find_package(soem) -> link -> run). That downstream step is what actually
# exercises the exported CMake target, not just the vendor package's own
# build.

name: Weekly build

on:
  schedule:
    # Every Monday at 06:00 UTC.
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  weekly-build:
    name: Build soem_vendor_ros2 + downstream consumer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: src/soem_vendor_ros2

      - name: Build .docker/Dockerfile image
        run: docker build -f src/soem_vendor_ros2/.docker/Dockerfile -t soem_vendor_ros2:weekly src/soem_vendor_ros2

      - name: colcon build + test soem_vendor_ros2 and its downstream probe
        run: |
          docker run --rm -v "${GITHUB_WORKSPACE}:/ws" -w /ws soem_vendor_ros2:weekly bash -e -c '
            rosdep init > /dev/null 2>&1 || true
            rosdep update
            rosdep install --from-paths src --ignore-src -y
            source /opt/ros/jazzy/setup.bash

            # downstream_probe lives nested under src/soem_vendor_ros2/test/,
            # and colcon does not recurse into a directory once it finds a
            # package.xml there (src/soem_vendor_ros2 itself), so it must be
            # given as its own base path or it is silently skipped.
            BASE_PATHS="src/soem_vendor_ros2 src/soem_vendor_ros2/test"
            colcon build --base-paths $BASE_PATHS --packages-select soem_vendor_ros2 downstream_probe
            colcon test --base-paths $BASE_PATHS --packages-select soem_vendor_ros2 downstream_probe
            colcon test-result --verbose
          '

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Weekly soem_vendor_ros2 build failed - upstream SOEM, the ROS jazzy apt repo, or .docker/Dockerfile may have drifted. See the job log above for which step failed."
